<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="540" viewBox="0 0 1020 540" role="img" aria-labelledby="title desc">
  <rect x="1000" width="20" height="540" fill="#eee9d9"/>
  <title id="title">찌릿 서비스 전체 구조</title><desc id="desc">사용자 입력이 FastAPI와 Azure ML, 요금 계산을 거쳐 리포트로 돌아오는 흐름</desc><rect width="1000" height="540" fill="#eee9d9"/>
  <style>text{font-family:Pretendard,'Malgun Gothic',Arial,sans-serif;fill:#314237}.eyebrow{font-size:13px;letter-spacing:2px}.title{font-size:28px;font-weight:700}.subtitle{font-size:14px;fill:#70786e}.step{font-size:12px;font-weight:700;fill:#63735f}.name{font-size:19px;font-weight:700}.body{font-size:13px;fill:#536057}.meta-label{font-size:12px;font-weight:700;fill:#52634f}.meta{font-size:12px;fill:#5f695f}.arrow{stroke:#6d8265;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6d8265"/></marker></defs>
  <text x="52" y="55" class="eyebrow">01 / JJIRIT · SERVICE ARCHITECTURE</text><text x="52" y="98" class="title">사용자 입력이 예측 리포트로 돌아오는 흐름</text><text x="52" y="125" class="subtitle">팀 서비스 전체 구조 · 김예찬은 Machine Learning 영역을 담당했습니다.</text>
  <g transform="translate(40 174)">
    <g><rect width="158" height="150" rx="14" fill="#dfe5d6" stroke="#c2cbbd"/><text x="18" y="29" class="step">01 · INPUT</text><text x="18" y="62" class="name">Frontend</text><text x="18" y="94" class="body">에어컨 유무</text><text x="18" y="117" class="body">하루 사용시간</text></g><path d="M166 75H196" class="arrow"/>
    <g transform="translate(204)"><rect width="158" height="150" rx="14" fill="#e4e8dc" stroke="#c7cdc0"/><text x="18" y="29" class="step">02 · API</text><text x="18" y="62" class="name">FastAPI</text><text x="18" y="94" class="body">입력 검증</text><text x="18" y="117" class="body">피처 변환</text></g><path d="M370 75H400" class="arrow"/>
    <g transform="translate(408)"><rect width="158" height="150" rx="14" fill="#cddbc7" stroke="#aebfaa"/><text x="18" y="29" class="step">03 · PREDICT</text><text x="18" y="62" class="name">Azure ML</text><text x="18" y="94" class="body">월 사용량</text><text x="18" y="117" class="body">kWh 예측</text></g><path d="M574 75H604" class="arrow"/>
    <g transform="translate(612)"><rect width="158" height="150" rx="14" fill="#e8dfc5" stroke="#d3c7a7"/><text x="18" y="29" class="step">04 · CALCULATE</text><text x="18" y="62" class="name">Bill Logic</text><text x="18" y="94" class="body">한전 요금식</text><text x="18" y="117" class="body">요금 범위 변환</text></g><path d="M778 75H808" class="arrow"/>
    <g transform="translate(816)"><rect width="132" height="150" rx="14" fill="#e3e4dc" stroke="#c7c9c1"/><text x="16" y="29" class="step">05 · OUTPUT</text><text x="16" y="62" class="name">Report</text><text x="16" y="94" class="body">요금 범위</text><text x="16" y="117" class="body">비교 리포트</text></g>
  </g>
  <g transform="translate(40 370)"><rect width="284" height="105" rx="12" fill="#f5f2e9" stroke="#d6d4c9"/><text x="18" y="31" class="meta-label">DATA</text><text x="18" y="59" class="meta">에코마일리지 · 날씨</text><text x="18" y="82" class="meta">한전 요금표</text><g transform="translate(306)"><rect width="284" height="105" rx="12" fill="#f5f2e9" stroke="#d6d4c9"/><text x="18" y="31" class="meta-label">DEPLOY</text><text x="18" y="59" class="meta">Cloudflare Pages</text><text x="18" y="82" class="meta">Azure App Service</text></g><g transform="translate(612)"><rect width="336" height="105" rx="12" fill="#f5f2e9" stroke="#d6d4c9"/><text x="18" y="31" class="meta-label">PRINCIPLE</text><text x="18" y="59" class="meta">개인정보 최소 수집</text><text x="18" y="82" class="meta">예측 범위와 한계 고지</text></g></g>
</svg>
