<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="620" viewBox="0 0 1020 620" role="img" aria-labelledby="title desc">
  <rect x="1000" width="20" height="620" fill="#e7eadf"/>
  <title id="title">김예찬의 찌릿 머신러닝 설계 과정</title><desc id="desc">데이터 한계 파악부터 입력 설계, 피처 엔지니어링, 알고리즘 선택, 평가와 사용자 범위 조정까지의 과정</desc><rect width="1000" height="620" fill="#e7eadf"/>
  <style>text{font-family:Pretendard,'Malgun Gothic',Arial,sans-serif;fill:#304136}.eyebrow{font-size:13px;letter-spacing:2px}.title{font-size:28px;font-weight:700}.subtitle{font-size:14px;fill:#6a7469}.num{font-size:11px;font-weight:700;letter-spacing:1px;fill:#71816d}.name{font-size:18px;font-weight:700}.body{font-size:12px;fill:#59645a}.formula{font-size:12px;font-weight:700;fill:#435645}.arrow{stroke:#71856c;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71856c"/></marker></defs>
  <text x="52" y="54" class="eyebrow">02 / MY CONTRIBUTION · MACHINE LEARNING</text><text x="52" y="98" class="title">데이터의 제약을 서비스 입력과 모델 설계로 연결했습니다</text><text x="52" y="126" class="subtitle">데이터 분석부터 피처 구성, 알고리즘 선택, 서비스 대상 조정까지 맡았습니다.</text>
  <g transform="translate(40 174)">
    <g><rect width="164" height="265" rx="14" fill="#f4f3eb" stroke="#cfd3c8"/><text x="18" y="30" class="num">01 · LIMIT</text><text x="18" y="67" class="name">데이터 이해</text><text x="18" y="104" class="body">월 사용량에는</text><text x="18" y="127" class="body">가전·집 구조·생활패턴</text><text x="18" y="150" class="body">정보가 없음</text><path d="M18 181H146" stroke="#d5d8cf"/><text x="18" y="211" class="formula">먼저 한계를 정의</text></g><path d="M172 132H192" class="arrow"/>
    <g transform="translate(200)"><rect width="164" height="265" rx="14" fill="#f1eddf" stroke="#d5ceb9"/><text x="18" y="30" class="num">02 · INPUT</text><text x="18" y="67" class="name">입력 설계</text><text x="18" y="104" class="body">5월 중앙값 115kWh</text><text x="18" y="127" class="body">+ 에어컨 사용시간</text><path d="M18 158H146" stroke="#dad3c2"/><text x="18" y="188" class="formula">115 + 시간 × 0.65</text><text x="18" y="210" class="formula">× 30일 × 0.60</text><text x="18" y="239" class="body">전년 사용량 입력 대리값</text></g><path d="M372 132H392" class="arrow"/>
    <g transform="translate(400)"><rect width="164" height="265" rx="14" fill="#dce5d7" stroke="#bdcbbb"/><text x="18" y="30" class="num">03 · FEATURE</text><text x="18" y="67" class="name">피처 엔지니어링</text><text x="18" y="104" class="body">month_sin · month_cos</text><text x="18" y="127" class="body">기온 · 습도 · 강수량</text><text x="18" y="150" class="body">불쾌지수 THI</text><path d="M18 181H146" stroke="#c8d3c5"/><text x="18" y="211" class="formula">계절 순환성과</text><text x="18" y="233" class="formula">온·습도 관계 반영</text></g><path d="M572 132H592" class="arrow"/>
    <g transform="translate(600)"><rect width="164" height="265" rx="14" fill="#d3dfcf" stroke="#afc0ac"/><text x="18" y="30" class="num">04 · MODEL</text><text x="18" y="67" class="name">알고리즘 선정</text><text x="18" y="104" class="body">Boosted Decision Tree</text><text x="18" y="127" class="body">Regression</text><path d="M18 158H146" stroke="#bfcebc"/><text x="18" y="188" class="formula">온도·습도 조건이</text><text x="18" y="210" class="formula">겹치는 비선형 구간</text><text x="18" y="232" class="formula">포착</text></g><path d="M772 132H792" class="arrow"/>
    <g transform="translate(800)"><rect width="148" height="265" rx="14" fill="#e8dfc5" stroke="#d4c7a4"/><text x="16" y="30" class="num">05 · EVALUATE</text><text x="16" y="67" class="name">평가·범위 조정</text><text x="16" y="104" class="body">MAE · RMSE · R²</text><text x="16" y="127" class="body">세 지표 함께 검토</text><path d="M16 158H132" stroke="#d9cfb4"/><text x="16" y="188" class="formula">300 → 500kWh</text><text x="16" y="210" class="body">고사용량 1인 가구도</text><text x="16" y="232" class="body">서비스 대상에 포함</text></g>
  </g>
  <g transform="translate(52 478)"><rect width="896" height="88" rx="12" fill="#f4f3ea" stroke="#ced3c8"/><text x="22" y="31" class="num">FINAL MODEL</text><text x="22" y="60" class="formula">R² 0.7424</text><text x="180" y="31" class="num">INTERPRETATION</text><text x="180" y="60" class="body">데이터 범위가 달라 MAE·RMSE의 증감을 같은 조건의 성능 비교로 단정하지 않음</text></g>
</svg>
